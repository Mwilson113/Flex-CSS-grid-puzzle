<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mary Wilson – Sunset Valley Puzzle</title>

  <style>
    :root {
      --ink: #382e4a;
      --accent: #9b4f70;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(135deg, #ffd3a6, #a99bc9);
    }

    .page-grid {
      max-width: 1100px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(360px, 2fr);
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header puzzle"
        "image puzzle"
        "footer puzzle";
      gap: 18px;
    }

    header,
    .puzzle-section,
    .image-card,
    .footer {
      border: 2px solid rgba(155, 79, 112, 0.16);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 30px rgba(56, 46, 74, 0.13);
    }

    header {
      grid-area: header;
      padding: 28px;
      background: var(--accent);
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }

    header p {
      margin: 8px 0 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .puzzle-section {
      grid-area: puzzle;
      min-height: 540px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .puzzle-section h2 {
      margin: 0 0 18px;
      color: var(--accent);
    }

    /* Three-by-three Flexbox puzzle */
    .puzzle {
      width: min(100%, 510px);
      aspect-ratio: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      border: 10px solid white;
      border-radius: 10px;
      overflow: hidden;
      background: #e6a65e;
      box-shadow: 0 14px 34px rgba(56, 46, 74, 0.25);
    }

    .piece {
      width: 33.333%;
      flex: 0 0 33.333%;
      aspect-ratio: 1;
      background-image: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85");
      background-size: 300% 300%;
      background-repeat: no-repeat;
    }

    .piece:nth-child(1) { background-position: 0% 0%; }
    .piece:nth-child(2) { background-position: 50% 0%; }
    .piece:nth-child(3) { background-position: 100% 0%; }

    .piece:nth-child(4) { background-position: 0% 50%; }
    .piece:nth-child(5) { background-position: 50% 50%; }
    .piece:nth-child(6) { background-position: 100% 50%; }

    .piece:nth-child(7) { background-position: 0% 100%; }
    .piece:nth-child(8) { background-position: 50% 100%; }
    .piece:nth-child(9) { background-position: 100% 100%; }

    /* Included in the HTML but hidden in the browser */
    .faulty-piece {
      display: none;
    }

    .image-card {
      grid-area: image;
      min-height: 260px;
      margin: 0;
      overflow: hidden;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .footer {
      grid-area: footer;
      padding: 18px 22px;
      text-align: center;
    }

    .footer strong {
      display: block;
      color: var(--accent);
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .footer time {
      display: block;
      margin-top: 5px;
      font-size: 1.1rem;
    }

    @media (max-width: 760px) {
      .page-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "puzzle"
          "image"
          "footer";
      }

      .puzzle-section {
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <main class="page-grid">
    <header>
      <h1>Mary Wilson</h1>
      <p>Sunset Valley Puzzle</p>
    </header>

    <section class="puzzle-section" aria-labelledby="puzzle-title">
      <h2 id="puzzle-title">Puzzle: Sunset Valley</h2>

      <div class="puzzle" aria-label="Completed three by three sunset valley puzzle">
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

        <div class="piece faulty-piece"></div>
      </div>
    </section>

    <figure class="image-card">
      <img
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85"
        alt="Sunset valley landscape">
    </figure>

    <footer class="footer">
      <strong>Completed</strong>
      <time datetime="2026-11-18">November 18, 2026</time>
    </footer>
  </main>
</body>
</html>
